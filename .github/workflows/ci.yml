name: ci
on:
  push:
jobs:
  a64diag:
    name: a64diag-${{ matrix.ubuntu }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    container:
      image: ubuntu:${{ matrix.ubuntu }}
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
    steps:
      - name: Get Packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates cmake gdb git python3 procps
      - uses: actions/checkout@v4.2.2
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DREALM_BUILD_TESTS=ON -DREALM_BUILD_GDB_TESTS=ON -DREALM_MAX_DIM=1
          cmake --build build --target realm_gdb_test --parallel $(nproc)
      - name: Diagnose
        run: sh .github/workflows/a64diag.sh build/tests/gdb/realm_gdb_test
