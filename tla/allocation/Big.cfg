\* Big: open hunt at the largest tractable scale.  5 instances, H=6, mixed
\* sizes (2,1,2,1,3), user poison on, full invariant battery.
\* TLC flags: -deadlock (invariant hunt).
\* Expected:  same known violations as Safety/Poison4 appear first
\*            (comment them out to go deeper); anything NEW here is an
\*            unregistered bug candidate - triage via DESIGN.md s8 before
\*            assuming spec error.
\* Scale:     sapling, > 1h - run via sapling_tlc.sbatch.  State space is
\*            dominated by the dependency-set branching (2^5 per request)
\*            times heap fragmentation shapes.
CONSTANTS
  HEAP_SIZE = 6
  INSTANCES = {1, 2, 3, 4, 5}
  Size <- SizesBig
  USER_POISON = TRUE
  C1_ENABLED = TRUE
  C2_ENABLED = TRUE
  C3_ENABLED = FALSE
  CLIENT_MODE = "FREE"
  FIX_CAP = FALSE
  FIX_SWEEP = FALSE
  FIX_RPR = FALSE
INIT MCInit
NEXT MCNext
INVARIANTS
  TypeOK
  INV_NoOverlap
  INV_InBounds
  INV_Conservation
  INV_CurrentMatchesGround
  INV_NoReadyWhenNoPendingAllocs
  INV_NoReadyAtRebuild
  INV_TriggeredDeallocPresent
  INV_StructuralAsserts
  INV_NoOrphanTags
  INV_InOrderUnblockSucceeds
  INV_FutureOffsetConsistency
  INV_PoisonReplayOnlyFailsAfterPoint
  INV_NoDupAlloc
  SAFETY_PromisesKept
  PROP_NotifyOnceSafety
  INV_QuiescentHeapEmpty
CONSTRAINT
  SeqCtrBound
