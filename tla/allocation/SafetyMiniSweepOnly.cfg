\* SafetyMiniSweepOnly: attribution isolation - the canonical BUG-6
\* reproducer with ONLY FIX_SWEEP enabled (FIX_CAP off).  BUG-6 must be
\* fixed by the sweep alone; the cap addresses the independent BUG-1
\* mechanism.  Note BUG-1 deadlocks still exist in this mode, which is why
\* the flags stay -deadlock (invariant hunt only).
\* TLC flags: -deadlock.
\* Expected:  GREEN - in particular INV_NoReadyWhenNoPendingAllocs and
\*            INV_NoReadyAtRebuild now PASS at the exact bounds where the
\*            base config violates them in 10s.  A violation here but not
\*            in SafetyMiniFixed would mean the cap is (wrongly)
\*            load-bearing for BUG-6 - an attribution error.
\* Scale:     local, tens of seconds.
CONSTANTS
  HEAP_SIZE = 3
  INSTANCES = {1, 2, 3}
  Size <- SizesLiveness
  USER_POISON = FALSE
  C1_ENABLED = TRUE
  C2_ENABLED = TRUE
  C3_ENABLED = FALSE
  CLIENT_MODE = "FREE"
  FIX_CAP = FALSE
  FIX_SWEEP = TRUE
  FIX_RPR = FALSE
INIT MCInit
NEXT MCNext
INVARIANTS
  TypeOK
  INV_NoOverlap
  INV_InBounds
  INV_Conservation
  INV_CurrentMatchesGround
  INV_NoReadyWhenNoPendingAllocs
  INV_NoReadyAtRebuild
  INV_TriggeredDeallocPresent
  INV_StructuralAsserts
  INV_NoOrphanTags
  INV_InOrderUnblockSucceeds
  INV_FutureOffsetConsistency
  INV_PoisonReplayOnlyFailsAfterPoint
  INV_NoDupAlloc
  SAFETY_PromisesKept
  PROP_NotifyOnceSafety
  INV_QuiescentHeapEmpty
CONSTRAINT
  SeqCtrBound
