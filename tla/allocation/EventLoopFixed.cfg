\* EventLoopFixed: the exact BUG-1 client (SCRIPTED_EVENTLOOP) with both
\* fixes on.  Under FIX_CAP, I2's deferred create is capped (its funding
\* set excludes the later-requested destroy of I1) and INSTANT-FAILS
\* instead of deferring into the cycle; the poison cascade resolves both
\* destroys and the run drains (I1 ends as a documented poisoned-destroy
\* leak terminal, instState[2] = FAILED).
\* TLC flags: NONE (deadlock checking ON).
\* Expected:  GREEN - no deadlock, full drain.  A deadlock here means
\*            FIX_CAP does not fix BUG-1 (fix-design bug).
\* Scale:     local, seconds.
CONSTANTS
  HEAP_SIZE = 3
  INSTANCES = {1, 2}
  Size <- SizesEventLoop
  USER_POISON = FALSE
  C1_ENABLED = TRUE
  C2_ENABLED = TRUE
  C3_ENABLED = FALSE
  CLIENT_MODE = "SCRIPTED_EVENTLOOP"
  FIX_CAP = TRUE
  FIX_SWEEP = TRUE
  FIX_RPR = TRUE
INIT MCInit
NEXT MCNext
INVARIANTS
  TypeOK
  INV_NoOverlap
  INV_InBounds
  INV_Conservation
  INV_CurrentMatchesGround
  INV_StructuralAsserts
  INV_NoDupAlloc
  SAFETY_PromisesKept
  INV_QuiescentHeapEmpty
CONSTRAINT
  SeqCtrBound
