\* Composite4Fixed: the BUG-6 -> BUG-4 composite script (SCRIPTED_COMPOSITE,
\* see Composite4.cfg for the 10-step witness) with the full fix bundle (CAP+SWEEP+RPR) on.
\* FIX_SWEEP removes the stranding at step 8 (the pendingAllocs->empty
\* sweep drains R3), so the rel resurrection at step 9 and the leaking ARR
\* swap at step 10 can never occur; FIX_SWEEP's BUG-4-standalone rel
\* re-apply in remove_pending_release covers the poison route as well.
\* TLC flags: -deadlock (matched to Composite4.cfg).
\* Expected:  FULLY GREEN - in particular INV_NoOrphanTags and
\*            INV_CurrentMatchesGround (the base config's leak detectors),
\*            plus the BUG-6 pair INV_NoReadyWhenNoPendingAllocs /
\*            INV_NoReadyAtRebuild, which the base deliberately excluded
\*            and this config ADDS.  A violation of the BUG-6 pair =>
\*            FIX_SWEEP design bug; of INV_NoOrphanTags => the composite
\*            leak survives the sweep (fix-design bug, high interest).
\* Scale:     local; scripted terms keep the interleaving space small.
CONSTANTS
  HEAP_SIZE = 4
  INSTANCES = {1, 2, 3, 4, 5}
  Size <- SizesComposite
  USER_POISON = FALSE
  C1_ENABLED = TRUE
  C2_ENABLED = TRUE
  C3_ENABLED = FALSE
  CLIENT_MODE = "SCRIPTED_COMPOSITE"
  FIX_CAP = TRUE
  FIX_SWEEP = TRUE
  FIX_RPR = TRUE
INIT MCInit
NEXT MCNext
INVARIANTS
  TypeOK
  INV_NoOverlap
  INV_InBounds
  INV_Conservation
  INV_CurrentMatchesGround
  INV_NoReadyWhenNoPendingAllocs
  INV_NoReadyAtRebuild
  INV_TriggeredDeallocPresent
  INV_InOrderUnblockSucceeds
  INV_FutureOffsetConsistency
  INV_PoisonReplayOnlyFailsAfterPoint
  INV_NoOrphanTags
  INV_QuiescentHeapEmpty
  PROP_NotifyOnceSafety
  INV_NoDupAlloc
  SAFETY_PromisesKept
  INV_StructuralAsserts
CONSTRAINT
  SeqCtrBound
