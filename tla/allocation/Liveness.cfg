\* Liveness: temporal check that every DEFERRED allocation eventually
\* resolves, under weak fairness on client requests, ballistic events and
\* trigger delivery (full-cleanup client).
\* TLC flags: -deadlock (deadlock checking OFF - the Done self-loop plus
\*            fairness handles termination; DESIGN.md s6).
\* Expected:  FAIL - LIVE_NoStuckAllocs via a BUG-1 lasso (an ALLOC_DEFERRED
\*            instance whose enabling release waits on its own eCreated).
\*            LivenessNoCross.cfg is the matched control at IDENTICAL bounds
\*            with CLIENT_MODE = "NO_CROSS_DEPS" -> expect PASS.
\* Bounds:    REDUCED (Phase 4, 2026-08-25) from 3 inst/H=4 to 2 inst/H=3
\*            (SizesEventLoop): the 3-instance liveness run's throughput
\*            collapsed ~5x from behavior-graph maintenance (~500k distinct
\*            at 10 min, queue still growing) and blew the local budget.
\*            2 instances retain the BUG-1 lasso (EventLoop scale) and make
\*            the FAIL/PASS pair a same-bounds controlled comparison.
\* Scale:     local, seconds-to-minutes at the reduced bounds.
CONSTANTS
  HEAP_SIZE = 3
  INSTANCES = {1, 2}
  Size <- SizesEventLoop
  USER_POISON = FALSE
  C1_ENABLED = TRUE
  C2_ENABLED = TRUE
  C3_ENABLED = FALSE
  CLIENT_MODE = "FREE"
  FIX_CAP = FALSE
  FIX_SWEEP = FALSE
  FIX_RPR = FALSE
SPECIFICATION LiveSpec
PROPERTIES
  LIVE_NoStuckAllocs
INVARIANTS
  TypeOK
  INV_NoOverlap
  INV_InBounds
  INV_StructuralAsserts
  SAFETY_PromisesKept
CONSTRAINT
  SeqCtrBound
