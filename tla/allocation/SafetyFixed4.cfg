\* SafetyFixed4: Safety's 4-instance bounds with the full fix bundle (CAP+SWEEP+RPR) on - the
\* fixed-model soundness run at the scale where the ARR partial path
\* (cc:1253-1310) and the cc:768 rebuild are reachable.  The BUG-6 pair
\* (INV_NoReadyWhenNoPendingAllocs / INV_NoReadyAtRebuild) is IN the
\* battery and must now HOLD (FIX_SWEEP).
\* TLC flags: -deadlock (invariant soundness hunt at scale).  Deadlock/
\*            drain liveness for the bundle is owned locally by SmokeFixed/
\*            EventLoopFixed/GCRipple/Inversion (Inversion runs deadlock-ON
\*            and is green under FIX_RPR); keeping the flag off here keeps
\*            the scale run focused on the invariant battery and avoids
\*            halting on any not-yet-registered liveness shape without its
\*            invariant fingerprint.
\* Expected:  FULLY GREEN, BUG-5 detectors included - the three-toggle
\*            bundle (FIX_RPR trailing replay) now addresses BUG-5.  Any
\*            violation is a fix-design flaw at scale or a new candidate
\*            (highest interest - report with trace, do not iterate past
\*            it).
\* Scale:     sapling (base Safety exceeded 110M distinct locally; the
\*            fixed space is the same order).
CONSTANTS
  HEAP_SIZE = 4
  INSTANCES = {1, 2, 3, 4}
  Size <- SizesSafety
  USER_POISON = FALSE
  C1_ENABLED = TRUE
  C2_ENABLED = TRUE
  C3_ENABLED = FALSE
  CLIENT_MODE = "FREE"
  FIX_CAP = TRUE
  FIX_SWEEP = TRUE
  FIX_RPR = TRUE
INIT MCInit
NEXT MCNext
INVARIANTS
  TypeOK
  INV_NoOverlap
  INV_InBounds
  INV_Conservation
  INV_CurrentMatchesGround
  INV_NoReadyWhenNoPendingAllocs
  INV_NoReadyAtRebuild
  INV_TriggeredDeallocPresent
  INV_StructuralAsserts
  INV_NoOrphanTags
  INV_InOrderUnblockSucceeds
  INV_FutureOffsetConsistency
  INV_PoisonReplayOnlyFailsAfterPoint
  INV_NoDupAlloc
  SAFETY_PromisesKept
  PROP_NotifyOnceSafety
  INV_QuiescentHeapEmpty
CONSTRAINT
  SeqCtrBound
