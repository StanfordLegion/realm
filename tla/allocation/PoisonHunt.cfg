\* PoisonHunt: the UNPREEMPTED user-poison hunt at 4 instances.
\* Identical to Poison4.cfg except the two expected-FAIL invariants
\* (INV_NoReadyWhenNoPendingAllocs, INV_NoReadyAtRebuild) are removed from
\* the battery: sapling round 1 (slurm-77809-Poison4.out) confirmed BUG-6 on
\* the poison paths (887M generated / 272M distinct, 47min), and since TLC
\* halts at the first violation, that known-expected hit PREEMPTED the deep
\* hunts this config exists for.  BUG-6 is deliberately NOT checked here -
\* already witnessed locally and at scale.
\* Purpose (DESIGN.md s8 targets, now reachable):
\*   BUG-4-standalone - remove_pending_release leaves rel := cur without the
\*     surviving READY releases (cc:1556-1557 vs cc:1573); a later ARR
\*     full-success swap (cc:1239) strands the tag in cur with its dealloc
\*     notify already fired.  A hit on INV_NoOrphanTags /
\*     INV_CurrentMatchesGround / INV_QuiescentHeapEmpty here is the FIRST
\*     TLC witness of the standalone (poison-reached) variant.
\*   BUG-5 (unfixed) - the poison rebuild never replays trailing pending
\*     allocs onto fut (cc:1562-1595) -> future overspending -> a hit on
\*     INV_FutureOffsetConsistency / INV_InOrderUnblockSucceeds /
\*     INV_NoOverlap is the first unfixed-code BUG-5 witness (the composed
\*     FIX_CAP witness already exists: traces/Inversion-bug5-deadlock.txt).
\*   cc:1587 assert(found) - INV_PoisonReplayOnlyFailsAfterPoint.
\* TLC flags: -deadlock (invariant hunt; deadlock class owned by
\*            EventLoop/Liveness).
\* Expected:  a hit on any detector above = new witness, save trace + report;
\*            GREEN = those bugs absent at these bounds.
\* Scale:     sapling; likely longer than round-1 Poison4's 47min since it
\*            will not stop early - use TLC -recover on resubmission.
CONSTANTS
  HEAP_SIZE = 4
  INSTANCES = {1, 2, 3, 4}
  Size <- SizesSafety
  USER_POISON = TRUE
  C1_ENABLED = TRUE
  C2_ENABLED = TRUE
  C3_ENABLED = FALSE
  CLIENT_MODE = "FREE"
  FIX_CAP = FALSE
  FIX_SWEEP = FALSE
  FIX_RPR = FALSE
INIT MCInit
NEXT MCNext
INVARIANTS
  TypeOK
  INV_NoOverlap
  INV_InBounds
  INV_Conservation
  INV_CurrentMatchesGround
  INV_TriggeredDeallocPresent
  INV_StructuralAsserts
  INV_NoOrphanTags
  INV_InOrderUnblockSucceeds
  INV_FutureOffsetConsistency
  INV_PoisonReplayOnlyFailsAfterPoint
  INV_NoDupAlloc
  SAFETY_PromisesKept
  PROP_NotifyOnceSafety
  INV_QuiescentHeapEmpty
CONSTRAINT
  SeqCtrBound
