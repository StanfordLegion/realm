\* SafetyHunt: the UNPREEMPTED BUG-3 hunt at the 4-instance scale.
\* Identical to Safety.cfg except the two expected-FAIL invariants
\* (INV_NoReadyWhenNoPendingAllocs, INV_NoReadyAtRebuild) are removed from
\* the battery: sapling round 1 (slurm-77808-Safety.out) confirmed BUG-6(a)
\* at scale (4.4B generated / 1.44B distinct, 5h04m, trace in that log), and
\* since TLC halts at the first violation, that known-expected hit PREEMPTED
\* the deep hunt this config exists for.  BUG-6 is deliberately NOT checked
\* here - it is already witnessed (SafetyMini.trace.txt locally, slurm-77808
\* at scale).
\* Purpose:   BUG-3 territory - soundness of the in-order unblock assert(ok)
\*            (cc:1668-1670 -> INV_InOrderUnblockSucceeds) and the future-
\*            offset cross-check (cc:1674-1691 -> INV_FutureOffsetConsistency)
\*            after attempt_release_reordering partial-success rewrites
\*            history; plus the full remaining safety battery.
\* TLC flags: -deadlock (deadlock checking OFF; deadlock class owned by
\*            EventLoop/Liveness).
\* Expected:  GREEN = BUG-3 absent at these bounds.  A hit on
\*            INV_InOrderUnblockSucceeds or INV_FutureOffsetConsistency is
\*            the FIRST BUG-3 witness - save the trace and report.
\* Scale:     sapling; likely LONGER than round-1 Safety's 5h04m since it
\*            will not stop early - use TLC -recover on resubmission.
CONSTANTS
  HEAP_SIZE = 4
  INSTANCES = {1, 2, 3, 4}
  Size <- SizesSafety
  USER_POISON = FALSE
  C1_ENABLED = TRUE
  C2_ENABLED = TRUE
  C3_ENABLED = FALSE
  CLIENT_MODE = "FREE"
  FIX_CAP = FALSE
  FIX_SWEEP = FALSE
  FIX_RPR = FALSE
INIT MCInit
NEXT MCNext
INVARIANTS
  TypeOK
  INV_NoOverlap
  INV_InBounds
  INV_Conservation
  INV_CurrentMatchesGround
  INV_TriggeredDeallocPresent
  INV_StructuralAsserts
  INV_NoOrphanTags
  INV_InOrderUnblockSucceeds
  INV_FutureOffsetConsistency
  INV_PoisonReplayOnlyFailsAfterPoint
  INV_NoDupAlloc
  SAFETY_PromisesKept
  PROP_NotifyOnceSafety
  INV_QuiescentHeapEmpty
CONSTRAINT
  SeqCtrBound
