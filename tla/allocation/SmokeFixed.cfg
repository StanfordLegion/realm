\* SmokeFixed: Smoke's bounds and FREE client with the full fix bundle (CAP+SWEEP+RPR) on
\* (FIX_CAP = BUG-1 capped admission, FIX_SWEEP = BUG-6/BUG-4 sweep).
\* The BUG-6 expected-FAIL invariants are ADDED here (they must now hold).
\* TLC flags: NONE (deadlock checking ON - the whole point: the BUG-1
\*            deadlock class must be gone; capped rejections cascade via
\*            poison and every run drains to Quiescent or a documented
\*            poisoned-destroy leak terminal).
\* Expected:  FULLY GREEN, including the deadlock check.
\*            A deadlock => FIX_CAP design bug (wait-graph not a DAG).
\*            A BUG-6-invariant violation => FIX_SWEEP design bug.
\*            Any other violation => fix regression or spec bug - Phase 5.
\* Scale:     local, seconds-minutes.
CONSTANTS
  HEAP_SIZE = 3
  INSTANCES = {1, 2}
  Size <- SizesSmoke
  USER_POISON = FALSE
  C1_ENABLED = TRUE
  C2_ENABLED = TRUE
  C3_ENABLED = FALSE
  CLIENT_MODE = "FREE"
  FIX_CAP = TRUE
  FIX_SWEEP = TRUE
  FIX_RPR = TRUE
INIT MCInit
NEXT MCNext
INVARIANTS
  TypeOK
  INV_NoOverlap
  INV_InBounds
  INV_Conservation
  INV_CurrentMatchesGround
  INV_NoReadyWhenNoPendingAllocs
  INV_NoReadyAtRebuild
  INV_TriggeredDeallocPresent
  INV_StructuralAsserts
  INV_NoOrphanTags
  INV_InOrderUnblockSucceeds
  INV_FutureOffsetConsistency
  INV_PoisonReplayOnlyFailsAfterPoint
  INV_NoDupAlloc
  SAFETY_PromisesKept
  PROP_NotifyOnceSafety
  INV_QuiescentHeapEmpty
CONSTRAINT
  SeqCtrBound
