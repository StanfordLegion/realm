\* BigFixed: Big's bounds (5 instances, H=6, mixed sizes, USER_POISON)
\* with the full fix bundle on - the largest fixed-model soundness sweep.
\* TLC flags: -deadlock (invariant hunt at scale; see SafetyFixed4.cfg
\*            header - deadlock/drain liveness is owned by the local
\*            bundle configs, Inversion deadlock-ON included).
\* Expected:  FULLY GREEN on the BUG-1/4/5/6 detector families (the
\*            three-toggle bundle addresses all four).  Anything else is
\*            either a fix-design flaw at scale or an unregistered bug
\*            candidate - triage via DESIGN.md s8 with the trace before
\*            assuming either.
\* Scale:     sapling, likely > 24h - submit with -t 48:00:00 and use the
\*            checkpoint/-recover flow in sapling_tlc.sbatch.
CONSTANTS
  HEAP_SIZE = 6
  INSTANCES = {1, 2, 3, 4, 5}
  Size <- SizesBig
  USER_POISON = TRUE
  C1_ENABLED = TRUE
  C2_ENABLED = TRUE
  C3_ENABLED = FALSE
  CLIENT_MODE = "FREE"
  FIX_CAP = TRUE
  FIX_SWEEP = TRUE
  FIX_RPR = TRUE
INIT MCInit
NEXT MCNext
INVARIANTS
  TypeOK
  INV_NoOverlap
  INV_InBounds
  INV_Conservation
  INV_CurrentMatchesGround
  INV_NoReadyWhenNoPendingAllocs
  INV_NoReadyAtRebuild
  INV_TriggeredDeallocPresent
  INV_StructuralAsserts
  INV_NoOrphanTags
  INV_InOrderUnblockSucceeds
  INV_FutureOffsetConsistency
  INV_PoisonReplayOnlyFailsAfterPoint
  INV_NoDupAlloc
  SAFETY_PromisesKept
  PROP_NotifyOnceSafety
  INV_QuiescentHeapEmpty
CONSTRAINT
  SeqCtrBound
