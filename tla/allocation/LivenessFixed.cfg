\* LivenessFixed: the Liveness temporal check with the full fix bundle (CAP+SWEEP+RPR) on.
\* LIVE_NoStuckAllocs's target set includes FAILED, so a capped
\* INSTANT_FAILURE (or a poison-cascade EVENTUAL_FAILURE) counts as
\* resolved - the property demands no allocation stays DEFERRED forever.
\* TLC flags: -deadlock (SPECIFICATION mode; Done self-loop + fairness).
\* Expected:  PASS - LIVE_NoStuckAllocs holds under FIX_CAP (the wait
\*            graph is a DAG; every deferral resolves).  A FAIL is a
\*            FIX_CAP design bug (residual cycle or starvation).
\* Bounds:    matched to Liveness.cfg's reduced bounds (2 inst / H=3) so
\*            FAIL(base) vs PASS(fixed) is a same-bounds comparison.
\* Scale:     local, seconds-to-minutes.
CONSTANTS
  HEAP_SIZE = 3
  INSTANCES = {1, 2}
  Size <- SizesEventLoop
  USER_POISON = FALSE
  C1_ENABLED = TRUE
  C2_ENABLED = TRUE
  C3_ENABLED = FALSE
  CLIENT_MODE = "FREE"
  FIX_CAP = TRUE
  FIX_SWEEP = TRUE
  FIX_RPR = TRUE
SPECIFICATION LiveSpec
PROPERTIES
  LIVE_NoStuckAllocs
INVARIANTS
  TypeOK
  INV_NoOverlap
  INV_InBounds
  INV_StructuralAsserts
  INV_NoDupAlloc
  SAFETY_PromisesKept
CONSTRAINT
  SeqCtrBound
