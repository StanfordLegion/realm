\* Poison4Fixed: Poison4's bounds (4 instances, USER_POISON) with BOTH
\* fixes on.  Validates FIX_SWEEP's poison-path coverage at scale: the
\* three-site sweep plus the BUG-4-standalone rel re-apply in
\* remove_pending_release mean the BUG-4/BUG-6 detector family
\* (INV_NoOrphanTags, INV_QuiescentHeapEmpty, INV_NoReadyWhenNoPendingAllocs,
\* INV_NoReadyAtRebuild, INV_CurrentMatchesGround) must now HOLD.
\* TLC flags: -deadlock (invariant hunt at scale; see SafetyFixed4.cfg
\*            header - deadlock/drain liveness is owned by the local
\*            bundle configs, Inversion deadlock-ON included).
\* Expected:  FULLY GREEN, BUG-5 detectors included - FIX_RPR's trailing
\*            replay closes BUG-5 (bugs/BUG-5.md), so a BUG-5-detector hit
\*            here (INV_FutureOffsetConsistency / INV_InOrderUnblockSucceeds
\*            / INV_NoOverlap) now means an FIX_RPR design bug on the
\*            poison paths: stop, save the trace, report.
\* Scale:     sapling (USER_POISON roughly doubles ballistic branching on
\*            top of the Safety-scale space).
CONSTANTS
  HEAP_SIZE = 4
  INSTANCES = {1, 2, 3, 4}
  Size <- SizesSafety
  USER_POISON = TRUE
  C1_ENABLED = TRUE
  C2_ENABLED = TRUE
  C3_ENABLED = FALSE
  CLIENT_MODE = "FREE"
  FIX_CAP = TRUE
  FIX_SWEEP = TRUE
  FIX_RPR = TRUE
INIT MCInit
NEXT MCNext
INVARIANTS
  TypeOK
  INV_NoOverlap
  INV_InBounds
  INV_Conservation
  INV_CurrentMatchesGround
  INV_NoReadyWhenNoPendingAllocs
  INV_NoReadyAtRebuild
  INV_TriggeredDeallocPresent
  INV_StructuralAsserts
  INV_NoOrphanTags
  INV_InOrderUnblockSucceeds
  INV_FutureOffsetConsistency
  INV_PoisonReplayOnlyFailsAfterPoint
  INV_NoDupAlloc
  SAFETY_PromisesKept
  PROP_NotifyOnceSafety
  INV_QuiescentHeapEmpty
CONSTRAINT
  SeqCtrBound
