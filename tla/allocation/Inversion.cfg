\* Inversion: the bugs/BUG-1.md A/R*/B trigger-inversion construction
\* (SCRIPTED_INVERSION) with the FULL fix bundle (CAP + SWEEP + RPR).
\* Script (H=3):
\*   I1 (sz 3) fills the heap immediately;
\*   A = I2 (sz 1, ballistic BA) requested next  -> cap(A) = 0;
\*   destroy(I1) = R1 (deps {1,2} - depends on eCreated(A): the cycle edge);
\*   B = I3 (sz 2, ballistic BB) requested AFTER destroy(1) (CreateOrderOK)
\*     -> cap(B) = 1 >= seq(R1).
\* Inverted triggers (BB before BA): B legally defers against R1; A then
\* arrives with cap(A) < cap(B).  Sized so that WITHOUT the monotone-cap
\* guard A would fit in fut behind B (free cell [2,3)) and be admitted -
\* rebuilding the BUG-1 cycle through the no-queue-jumping fut test.  The
\* guard INSTANT-FAILs A; the poison cascade removes R1 (its precondition
\* fires poisoned) and FIX_RPR's trailing-alloc replay in
\* remove_pending_release EVENTUAL_FAILs B cleanly; the run drains
\* (I1 ends as a documented leak terminal).
\* TLC flags: NONE (deadlock checking ON - full drain required).
\* Expected:  GREEN over the full space, deadlock check included:
\*            INV_InversionCapped and SAFETY_PromisesKept hold everywhere
\*            and every interleaving drains; B ends EVENTUAL_FAILURE
\*            cleanly via the RPR trailing replay.
\* History:   with FIX_RPR = FALSE this config reproduces the BUG-5
\*            stranding as a deadlock (witness kept:
\*            traces/Inversion-bug5-deadlock.txt): the cap correctly
\*            failed A, R1 fired poisoned and was removed, but B - a
\*            TRAILING alloc whose lastSeq exceeds every walked seqid -
\*            was never revisited by the RPR replay: neither failed nor
\*            refunded.  That run established the composition finding
\*            that FIX_CAP without FIX_RPR is NOT shippable (the cap
\*            increases poisoned-release frequency, making BUG-5's hole
\*            load-bearing for drain liveness); hence the three-toggle
\*            bundle.  A deadlock in THIS config => FIX_RPR design bug
\*            (trailing replay missed a case).
\* Scale:     local, seconds.
CONSTANTS
  HEAP_SIZE = 3
  INSTANCES = {1, 2, 3}
  Size <- SizesInversion
  USER_POISON = FALSE
  C1_ENABLED = TRUE
  C2_ENABLED = TRUE
  C3_ENABLED = FALSE
  CLIENT_MODE = "SCRIPTED_INVERSION"
  FIX_CAP = TRUE
  FIX_SWEEP = TRUE
  FIX_RPR = TRUE
INIT MCInit
NEXT MCNext
INVARIANTS
  TypeOK
  INV_NoOverlap
  INV_InBounds
  INV_Conservation
  INV_CurrentMatchesGround
  INV_StructuralAsserts
  SAFETY_PromisesKept
  INV_InversionCapped
  INV_PoisonReplayOnlyFailsAfterPoint
  INV_NoDupAlloc
  INV_QuiescentHeapEmpty
CONSTRAINT
  SeqCtrBound
