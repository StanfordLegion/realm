\* EventLoopCapOnly: attribution isolation - the BUG-1 client with ONLY
\* FIX_CAP enabled (FIX_SWEEP off).  BUG-1 must be fixed by the cap alone;
\* the sweep addresses the independent BUG-6/BUG-4 mechanism.
\* TLC flags: NONE (deadlock checking ON).
\* Expected:  GREEN - no deadlock, full drain, same outcome class as
\*            EventLoopFixed.  A deadlock here but not in EventLoopFixed
\*            would mean the sweep is (wrongly) load-bearing for BUG-1 -
\*            an attribution error in the fix design.
\* Scale:     local, seconds.
CONSTANTS
  HEAP_SIZE = 3
  INSTANCES = {1, 2}
  Size <- SizesEventLoop
  USER_POISON = FALSE
  C1_ENABLED = TRUE
  C2_ENABLED = TRUE
  C3_ENABLED = FALSE
  CLIENT_MODE = "SCRIPTED_EVENTLOOP"
  FIX_CAP = TRUE
  FIX_SWEEP = FALSE
  FIX_RPR = FALSE
INIT MCInit
NEXT MCNext
INVARIANTS
  TypeOK
  INV_NoOverlap
  INV_InBounds
  INV_Conservation
  INV_CurrentMatchesGround
  INV_StructuralAsserts
  INV_NoDupAlloc
  SAFETY_PromisesKept
  INV_QuiescentHeapEmpty
CONSTRAINT
  SeqCtrBound
