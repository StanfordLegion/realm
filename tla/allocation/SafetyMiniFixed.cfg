\* SafetyMiniFixed: the canonical BUG-6 reproducer bounds with the full fix bundle (CAP+SWEEP+RPR)
\* on.  FIX_SWEEP performs the stranded-ready sweep at the
\* pendingAllocs->empty transitions, so the ready entry can no longer be
\* stranded behind a non-ready one.
\* TLC flags: -deadlock (matched to SafetyMini.cfg for a controlled
\*            comparison; the deadlock class is covered by SmokeFixed /
\*            EventLoopFixed).
\* Expected:  FULLY GREEN - in particular INV_NoReadyWhenNoPendingAllocs
\*            and INV_NoReadyAtRebuild (the base config's expected-FAIL
\*            pair) now PASS.  A violation of either => FIX_SWEEP design
\*            bug; any other violation => fix regression - Phase 5.
\* Scale:     local, tens of seconds (base found BUG-6 in 10s at 5.5M
\*            states; the fixed space is comparable).
CONSTANTS
  HEAP_SIZE = 3
  INSTANCES = {1, 2, 3}
  Size <- SizesLiveness
  USER_POISON = FALSE
  C1_ENABLED = TRUE
  C2_ENABLED = TRUE
  C3_ENABLED = FALSE
  CLIENT_MODE = "FREE"
  FIX_CAP = TRUE
  FIX_SWEEP = TRUE
  FIX_RPR = TRUE
INIT MCInit
NEXT MCNext
INVARIANTS
  TypeOK
  INV_NoOverlap
  INV_InBounds
  INV_Conservation
  INV_CurrentMatchesGround
  INV_NoReadyWhenNoPendingAllocs
  INV_NoReadyAtRebuild
  INV_TriggeredDeallocPresent
  INV_StructuralAsserts
  INV_NoOrphanTags
  INV_InOrderUnblockSucceeds
  INV_FutureOffsetConsistency
  INV_PoisonReplayOnlyFailsAfterPoint
  INV_NoDupAlloc
  SAFETY_PromisesKept
  PROP_NotifyOnceSafety
  INV_QuiescentHeapEmpty
CONSTRAINT
  SeqCtrBound
