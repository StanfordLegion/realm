\* Poison4: user-poison hunt at 4 instances.  Targets (DESIGN.md s8):
\*   BUG-4-escalated - remove_pending_release leaves rel := cur without the
\*     surviving READY releases (cc:1556-1557 vs cc:1573); a later ARR
\*     full-success swap (cc:1239) strands the tag in cur with its dealloc
\*     notify already fired -> INV_NoOrphanTags / INV_QuiescentHeapEmpty.
\*   BUG-5 - the poison rebuild never replays trailing pending allocs onto
\*     fut (no trailing replay after cc:1562-1595) -> future overspending ->
\*     INV_FutureOffsetConsistency / INV_InOrderUnblockSucceeds /
\*     INV_NoOverlap.
\*   BUG-6(b) - poison-path variant of the stranded-ready state ->
\*     INV_NoReadyWhenNoPendingAllocs / INV_NoReadyAtRebuild.
\* TLC flags: -deadlock (invariant hunt; deadlock class owned by
\*            EventLoop/Liveness).
\* Expected:  FAIL - likely first INV_NoReadyWhenNoPendingAllocs (BUG-6);
\*            iterate by commenting out confirmed-expected invariants and
\*            re-running to reach the BUG-4/BUG-5 detectors.
\* Scale:     sapling-likely (try local first; USER_POISON roughly doubles
\*            the ballistic branching).
