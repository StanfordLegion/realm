\* Safety: main local safety hunt at the 4-instance scale that makes the
\* attempt_release_reordering PARTIAL path (cc:1253-1310) and the cc:768
\* future-rebuild reachable (needs >=2 pending allocs + >=2 pending
\* releases with one ready).
\* Sizes (2,1,1,2) on H=4 cover the BUG-6(a) 4-instance recipe from
\* DESIGN.md s8; NOTE that TLC (BFS) will likely find the SHORTER canonical
\* 3-instance witness first (see EXPECTED.md - Phase 2 already produced it):
\*   destroy(i1) deferred = R1; create i2 -> DEFERRED lastSeq=seq(R1);
\*   destroy(i2) deferred = R2 (legal: request != trigger);
\*   destroy(i3) triggered -> ARR gate fails -> R3 pushed READY;
\*   trigger destroy(i1) -> oldest drain places i2, pendingAllocs empties,
\*   do-while stops at non-ready R2 -> ready R3 stranded.
\* TLC flags: -deadlock (deadlock checking OFF).  Rationale: BUG-1 deadlock
\*            traces are short and would preempt the deeper invariant hunts
\*            (TLC halts at the first violation); EventLoop/Liveness own the
\*            deadlock class.  Deviation from the DESIGN.md s7 "dlk" mark,
\*            documented in EXPECTED.md.
\* Expected:  FAIL - INV_NoReadyWhenNoPendingAllocs (BUG-6).  After recording
\*            that trace, comment it AND INV_NoReadyAtRebuild out and re-run
\*            to continue hunting (BUG-3 territory: INV_InOrderUnblockSucceeds,
\*            INV_FutureOffsetConsistency).
\* Scale:     local, minutes-hours, ~10^7-10^9 states; sapling fallback.
CONSTANTS
  HEAP_SIZE = 4
  INSTANCES = {1, 2, 3, 4}
  Size <- SizesSafety
  USER_POISON = FALSE
  C1_ENABLED = TRUE
  C2_ENABLED = TRUE
  C3_ENABLED = FALSE
  CLIENT_MODE = "FREE"
  FIX_CAP = FALSE
  FIX_SWEEP = FALSE
  FIX_RPR = FALSE
INIT MCInit
NEXT MCNext
INVARIANTS
  TypeOK
  INV_NoOverlap
  INV_InBounds
  INV_Conservation
  INV_CurrentMatchesGround
  INV_NoReadyWhenNoPendingAllocs
  INV_NoReadyAtRebuild
  INV_TriggeredDeallocPresent
  INV_StructuralAsserts
  INV_NoOrphanTags
  INV_InOrderUnblockSucceeds
  INV_FutureOffsetConsistency
  INV_PoisonReplayOnlyFailsAfterPoint
  INV_NoDupAlloc
  SAFETY_PromisesKept
  PROP_NotifyOnceSafety
  INV_QuiescentHeapEmpty
CONSTRAINT
  SeqCtrBound
