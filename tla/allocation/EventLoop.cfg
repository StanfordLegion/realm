\* EventLoop: minimal scripted reproduction of BUG-1 (deferred create is
\* ordered at trigger time, not request time -> event-loop deadlock).
\* Client is hardcoded to the DESIGN.md s5 worked example:
\*   preC(1)=NOW, preC(2)=ballistic, preD(1)=deps{1,2}, preD(2)=deps{2};
\*   sizes 3,3 on H=3 so instance 2 can only be planned into 1's space.
\* TLC flags: NONE (deadlock checking ON).
\* Expected:  FAIL - TLC deadlock counterexample, ~7 steps, matching the
\*            hand-simulated trace in MCDeferredAlloc.tla's trailer comment.
\*            A clean pass here means the model LOST the bug (spec error).
\* Scale:     local, seconds.
CONSTANTS
  HEAP_SIZE = 3
  INSTANCES = {1, 2}
  Size <- SizesEventLoop
  USER_POISON = FALSE
  C1_ENABLED = TRUE
  C2_ENABLED = TRUE
  C3_ENABLED = FALSE
  CLIENT_MODE = "SCRIPTED_EVENTLOOP"
  FIX_CAP = FALSE
  FIX_SWEEP = FALSE
  FIX_RPR = FALSE
INIT MCInit
NEXT MCNext
INVARIANTS
  TypeOK
  INV_NoOverlap
  INV_InBounds
  INV_Conservation
  INV_CurrentMatchesGround
  INV_StructuralAsserts
  SAFETY_PromisesKept
CONSTRAINT
  SeqCtrBound
