\* GCRipple: the FIX-REVIEW.md trade-off client 1 (SCRIPTED_GCRIPPLE) with
\* the full fix bundle on.  Script: I1 (sz 3) fills the heap immediately; I2 (sz 3)
\* is gated on ballistic B; destroy(I1) is requested AFTER I2's create
\* (DestroyOrderOK) and gated on ballistic D.  The environment fires D and
\* B in nondeterministic order, and trigger delivery interleaves further.
\* Intent under the pure cap (FIX_CAP v1, no ready-fold):
\*   - destroy APPLIED before I2's create-trigger -> I2 INSTANT-SUCCEEDS
\*     (completed releases fund via current regardless of cap);
\*   - otherwise -> I2 INSTANT-FAILS honestly (ACCEPTED BEHAVIOR CHANGE:
\*     the cap excludes the later-requested pending destroy - this is the
\*     documented false-OOM cost of the pure cap; the ready-fold /
\*     ballistic-lite variants that rescue it are v-next-next).
\*   Both end classes are reachable; I2 must never be ALLOC_DEFERRED
\*   (INV_GCRippleNoDefer) and never stuck (deadlock check).
\* TLC flags: NONE (deadlock checking ON - full drain required).
\* Expected:  GREEN.  INV_GCRippleNoDefer violation => the cap admitted a
\*            deferral it must reject (fix-design bug).
\*            INV_GCRippleSuccessFunded violation => a success not funded
\*            by the completed release (spec bug).  Deadlock => cascade
\*            failed to drain (fix-design bug).
\* Scale:     local, seconds.
CONSTANTS
  HEAP_SIZE = 3
  INSTANCES = {1, 2}
  Size <- SizesGCRipple
  USER_POISON = FALSE
  C1_ENABLED = TRUE
  C2_ENABLED = TRUE
  C3_ENABLED = FALSE
  CLIENT_MODE = "SCRIPTED_GCRIPPLE"
  FIX_CAP = TRUE
  FIX_SWEEP = TRUE
  FIX_RPR = TRUE
INIT MCInit
NEXT MCNext
INVARIANTS
  TypeOK
  INV_NoOverlap
  INV_InBounds
  INV_Conservation
  INV_CurrentMatchesGround
  INV_StructuralAsserts
  INV_NoDupAlloc
  SAFETY_PromisesKept
  INV_GCRippleNoDefer
  INV_GCRippleSuccessFunded
  INV_QuiescentHeapEmpty
CONSTRAINT
  SeqCtrBound
