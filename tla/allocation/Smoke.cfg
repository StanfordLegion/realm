\* Smoke: fast parse/typecheck/sanity gate - GREEN BASELINE.
\* Purpose:   everything parses, all checked invariants hold on a tiny space.
\* NOTE:      the expected-FAIL invariants (INV_NoReadyWhenNoPendingAllocs,
\*            INV_NoReadyAtRebuild = BUG-6) are deliberately NOT checked here
\*            so Smoke stays green; Safety owns them.
\* TLC flags: NONE (deadlock checking ON).
\* Expected:  clean pass, OR a deadlock counterexample of the BUG-1 shape
\*            (a wait cycle rooted in an ALLOC_DEFERRED instance - reachable
\*            even at this scale; both outcomes are non-alarming, see
\*            EXPECTED.md).  Any INVARIANT violation here means a spec bug,
\*            not a Realm bug.
\* Scale:     local, seconds-minutes, < 10^6 states.
CONSTANTS
  HEAP_SIZE = 3
  INSTANCES = {1, 2}
  Size <- SizesSmoke
  USER_POISON = FALSE
  C1_ENABLED = TRUE
  C2_ENABLED = TRUE
  C3_ENABLED = FALSE
  CLIENT_MODE = "FREE"
  FIX_CAP = FALSE
  FIX_SWEEP = FALSE
  FIX_RPR = FALSE
INIT MCInit
NEXT MCNext
INVARIANTS
  TypeOK
  INV_NoOverlap
  INV_InBounds
  INV_Conservation
  INV_CurrentMatchesGround
  INV_TriggeredDeallocPresent
  INV_StructuralAsserts
  INV_NoOrphanTags
  INV_InOrderUnblockSucceeds
  INV_FutureOffsetConsistency
  INV_PoisonReplayOnlyFailsAfterPoint
  SAFETY_PromisesKept
  PROP_NotifyOnceSafety
  INV_QuiescentHeapEmpty
CONSTRAINT
  SeqCtrBound
