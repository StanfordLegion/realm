\* LivenessNoCross: confirmatory control for the Liveness config.
\* Identical to Liveness.cfg except CLIENT_MODE = "NO_CROSS_DEPS": destroy
\* preconditions may not wait on another instance's eCreated, which excludes
\* exactly the BUG-1 cycle shape.
\* TLC flags: -deadlock.
\* Expected:  PASS - LIVE_NoStuckAllocs holds; this is the control showing
\*            the Liveness failure is specifically the cross-dependency
\*            cycle (BUG-1), not fairness or model artifacts.  A FAIL here
\*            is a SECOND, independent liveness bug -> Phase 5, high
\*            interest.
\* Bounds:    matched to Liveness.cfg's reduced bounds (2 inst / H=3,
\*            SizesEventLoop) so the FAIL/PASS pair is a same-bounds
\*            controlled comparison; see Liveness.cfg header for why.
\* Scale:     local, seconds-to-minutes at the reduced bounds.
CONSTANTS
  HEAP_SIZE = 3
  INSTANCES = {1, 2}
  Size <- SizesEventLoop
  USER_POISON = FALSE
  C1_ENABLED = TRUE
  C2_ENABLED = TRUE
  C3_ENABLED = FALSE
  CLIENT_MODE = "NO_CROSS_DEPS"
  FIX_CAP = FALSE
  FIX_SWEEP = FALSE
  FIX_RPR = FALSE
SPECIFICATION LiveSpec
PROPERTIES
  LIVE_NoStuckAllocs
INVARIANTS
  TypeOK
  INV_NoOverlap
  INV_InBounds
  INV_StructuralAsserts
  SAFETY_PromisesKept
CONSTRAINT
  SeqCtrBound
