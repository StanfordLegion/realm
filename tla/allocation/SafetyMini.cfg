\* SafetyMini: local reproducer for BUG-6 at the canonical 3-instance scale
\* (added during Phase 2 validation - the full Safety.cfg at 4 instances is
\* ~10^9 states and needs sapling).
\* Shape: H=3, sizes (2,2,1).  i1(2)+i3(1) fill the heap; i2(2) can only be
\* planned against a pending release; freeing i3 alone leaves a size-1 gap so
\* the ARR front-gate fails and a triggered destroy(i3) is pushed READY;
\* draining destroy(i1) then places i2 and empties pendingAllocs with the
\* ready entry stranded behind the non-ready destroy(i2) entry.
\* TLC flags: -deadlock (deadlock class owned by EventLoop/Liveness).
\* Expected:  FAIL - INV_NoReadyWhenNoPendingAllocs (BUG-6), the canonical
\*            witness from EXPECTED.md.
\* Scale:     local, minutes.
CONSTANTS
  HEAP_SIZE = 3
  INSTANCES = {1, 2, 3}
  Size <- SizesLiveness
  USER_POISON = FALSE
  C1_ENABLED = TRUE
  C2_ENABLED = TRUE
  C3_ENABLED = FALSE
  CLIENT_MODE = "FREE"
  FIX_CAP = FALSE
  FIX_SWEEP = FALSE
  FIX_RPR = FALSE
INIT MCInit
NEXT MCNext
INVARIANTS
  TypeOK
  INV_NoOverlap
  INV_InBounds
  INV_Conservation
  INV_CurrentMatchesGround
  INV_NoReadyWhenNoPendingAllocs
  INV_NoReadyAtRebuild
  INV_TriggeredDeallocPresent
  INV_StructuralAsserts
  INV_NoOrphanTags
  INV_InOrderUnblockSucceeds
  INV_FutureOffsetConsistency
  INV_PoisonReplayOnlyFailsAfterPoint
  INV_NoDupAlloc
  SAFETY_PromisesKept
  PROP_NotifyOnceSafety
  INV_QuiescentHeapEmpty
CONSTRAINT
  SeqCtrBound
