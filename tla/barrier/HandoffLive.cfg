\* LIVENESS.  Safety plus deadlock detection does not establish progress: an
\* execution that keeps taking steps forever without ever triggering has a
\* successor at every step and no invariant to violate.  These need the
\* fairness assumptions, which is why the specification here is FairSpec and
\* not Spec.
\*
\* NO SYMMETRY.  Symmetry reduction is unsound for temporal properties and TLC
\* will say so; none of these configs may declare it.

SPECIFICATION FairSpec

CONSTANTS
    Nodes     <- MCNodes
    Owner     <- MCOwner
    MaxGen    <- MCMaxGen
    Pattern   <- MCPattern
    NumPlans  <- MCNumPlans
    Plans     <- MCPlans
    PlanStart <- MCPlanStart
    BaseCount <- MCBaseCount
    AlterOps  <- MCAlterOps

INVARIANTS
    TypeOK
    TriggerInOrder
    TriggerCorrect
    NoEarlyTrigger
    TsStreamSingleGate
    NoLingeringBypasser
    GateNamesRealAlteration
    NoOverCount
    ReachableWhileHolding
    BoundedRetention
    ExpectedSane

PROPERTIES
    EventuallyTriggered
    EventuallyDrained
    EventuallyCollected
