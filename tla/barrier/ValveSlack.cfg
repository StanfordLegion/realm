\* T4-03 - the R3-07 owner slack valve.  After the recipient-side flush was
\* removed, the valve is the SOLE mechanism carrying ARRIVAL_PROTOCOL rule 8.4,
\* and it was not modelled at all.  This scenario reaches both halves: the
\* receipt check when the bypassed arrival lands after the plan installs, and
\* the switch-time over_slack flush when it runs ahead of the install.
\* Deadlock checking is what proves each half load-bearing - removing either
\* leaves a relay waiting for ever.

SPECIFICATION Spec

CONSTANTS
    Nodes     <- MCNodes
    Owner     <- MCOwner
    MaxGen    <- MCMaxGen
    Pattern   <- MCPattern
    NumPlans  <- MCNumPlans
    Plans     <- MCPlans
    PlanStart <- MCPlanStart
    BaseCount <- MCBaseCount
    AlterOps  <- MCAlterOps

INVARIANTS
    TypeOK
    TriggerInOrder
    TriggerCorrect
    NoEarlyTrigger
    TsStreamSingleGate
    NoLingeringBypasser
    GateNamesRealAlteration
    NoOverCount
    ReachableWhileHolding
    BoundedRetention
    ExpectedSane
